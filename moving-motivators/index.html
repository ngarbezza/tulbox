function shuffle(array) {
  let currentIndex = array.length;
  while (currentIndex !== 0) {
    const randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex -= 1;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

function getDefaultLanguage() {
  const browserLanguage = window.navigator.language;
  if (browserLanguage.includes('-')) {
    return browserLanguage.split('-')[0];
  }
  return browserLanguage;
}

const LocaleSelector = {
  name: 'LocaleSelector',
  template: `
    <div class="locale-changer">
      <span>Change language: </span>
      <label>
        <select v-model="$i18n.locale" name="locale-select">
          <option v-for="locale in $i18n.availableLocales" :key="'locale-' + locale" :value="locale">
            {{ locale }}
          </option>
        </select>
      </label>
    </div>
  `,
};

const PrioritizedMotivators = {
  name: 'PrioritizedMotivators',
  setup() {
    const { ref } = Vue;

    const shuffled = ref(shuffle(motivators.slice()));
    const selectedMotivator = ref(null);
    const dragging = ref(false);
    const draggedIndex = ref(null);

    const viewingMotivator = (motivator) => {
      if (!dragging.value) selectedMotivator.value = motivator;
    };
    const unsetMotivator = () => {
      if (!dragging.value) selectedMotivator.value = null;
    };

    const selectedMotivatorStatus = () => {
      if (dragging.value) return 'actions.ordering';
      return selectedMotivator.value?.name ?? 'actions.choose_motivator';
    };

    const onDragStart = (index) => {
      dragging.value = true;
      draggedIndex.value = index;
    };
    const onDragEnter = (index) => {
      const from = draggedIndex.value;
      if (from === null || from === index) return;
      const list = shuffled.value;
      const [moved] = list.splice(from, 1);
      list.splice(index, 0, moved);
      draggedIndex.value = index;
    };
    const onDragEnd = () => {
      if (draggedIndex.value !== null) selectedMotivator.value = shuffled.value[draggedIndex.value];
      dragging.value = false;
      draggedIndex.value = null;
    };

    return {
      motivators: shuffled,
      selectedMotivator,
      dragging,
      draggedIndex,
      viewingMotivator,
      unsetMotivator,
      selectedMotivatorStatus,
      onDragStart,
      onDragEnter,
      onDragEnd,
    };
  },
  template: `
    <div>
      <h1>Moving Motivators</h1>

      <p class="motivators-explanation">
        Ordena los siguientes motivadores de acuerdo a tus preferencias.
        <br>
        Al posicionarte en cada ítem podrás ver una descripción para entender qué significa cada uno.
        <br>
        Moving Motivators es una de las actividades de Management 3.0
        (<a href="https://management30.com/practice/moving-motivators/">más info aquí</a>)
      </p>
      <div class="motivators-container">
        <div class="motivators-list">
          <div
            v-for="(motivator, index) in motivators"
            :key="motivator.id"
            class="motivator-stacked"
            :class="{ dragging: dragging && index === draggedIndex }"
            :style="'background-color: ' + motivator.color"
            draggable="true"
            @dragstart="onDragStart(index)"
            @dragenter.prevent="onDragEnter(index)"
            @dragover.prevent
            @dragend="onDragEnd"
            @mouseenter="viewingMotivator(motivator)"
            @focus="viewingMotivator(motivator)"
            @mouseleave="unsetMotivator"
            @blur="unsetMotivator"
          >
            <div class="motivator-name">{{ $t(motivator.name) }}</div>
          </div>
        </div>
        <div class="motivator-detail">
          <h3>{{ $t(selectedMotivatorStatus()) }}</h3>
          <p v-if="selectedMotivator && !dragging" class="motivator-description">
            "{{ $t(selectedMotivator.description) }}"
          </p>
        </div>
      </div>
    </div>
  `,
};

const App = {
  name: 'App',
  components: { PrioritizedMotivators, LocaleSelector },
  template: `
    <div class="moving-motivators-container">

  `,
};

const locale = getDefaultLanguage();
const i18n = VueI18n.createI18n({ locale, messages: translations, fallbackLocale: 'en' });

Vue.createApp(App).use(i18n).mount('#app');
</script>
